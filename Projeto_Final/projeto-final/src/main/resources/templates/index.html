<!doctype html>
<html lang="pt-br" xmlns:th="https://thymeleaf.org" xmlns:layout="https://www.ultraq.net.nc/thymeleaf/layout">
<head>
  <meta name="author" content="Nicole Santos">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{css/estilos.css}" type="text/css" media="all">
</head>
<body>
  <!-- Navbar -->
  <header th:replace="fragments/navbar :: navbar"></header>

  <!-- Conteúdo Principal -->
  <main class="mb-5">
    <div class="container col-xxl-8 px-4 py-5">
      <div class="row flex-lg-row-reverse align-items-center g-5 py-5">
        <div class="col-10 col-sm-8 col-lg-6">
          <img src="img/computer.jpg" class="d-block mx-lg-auto img-fluid img" alt="Bootstrap Themes" width="700" height="500" loading="lazy">
        </div>
        <div class="col-lg-6">
          <h1 class="display-5 fw-bold text-body-emphasis lh-1 mb-3">Cadastro de Desaparecidos</h1>
          <p class="lead">
            Esse site tem como objetivo realizar o cadastro de desaparecidos para que mais pessoas possam fornecer informações sobre os casos.
          </p>
          <div class="d-grid gap-2 d-md-flex justify-content-md-start">
            <a class="btn btn-primary btn-lg px-4 me-md-2" href="/cadastrar">Cadastre aqui</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer th:replace="fragments/footer :: footer"></footer>

  <!-- Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>
</html>
